submission:
  title: "Drug Safety Signal Detector & Regulatory Submission Readiness Checker""                            # REQUIRED — Project display name, e.g., "SmartOps Dashboard"

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
    Pharmaceutical companies and regulatory teams struggle to manually detect
    adverse drug safety signals and verify ICH M4 CTD submission completeness.
    Our app automates PRR-based signal detection and gap report generation.

  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
    We built a web app that uses PRR algorithm to detect adverse drug safety
    signals, clusters events into clinical categories, and checks ICH M4 CTD
    submission completeness with automated gap report generation.

  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - "PRR-based adverse event signal detection with 2x2 table calculation"
    - "Automatic event clustering into 6 clinical categories"
    - "ICH M4 CTD submission completeness checker with progress bars"
    - "Automated gap report generation with downloadable TXT export"                                                                                                 
    - "Drag and drop CTD document upload with simulated analysis"     # e.g., "Real-time pipeline anomaly detection using watsonx.ai"
   
                                   # optional 4th
                                  # optional 5th

  tech_stack:
  
languages: ["HTML5", "CSS3", "JavaScript"]     # REQUIRED — e.g., ["Python", "TypeScript"]
frameworks: ["Vanilla JavaScript - No frameworks"]  # e.g., ["FastAPI", "React"]
ibm_technologies: ["IBM Bob AI Assistant"]    # e.g., ["watsonx.ai", "IBM Bob", "IBM Cloud Functions"]
databases: ["Mock data layer - No database required"]   # e.g., ["watsonx.ai", "IBM Bob", "IBM Cloud Functions"]
other: ["GitHub Pages"]            # e.g., ["Docker", "GitHub Actions", "Slack API"]        
                     
                     
                                       

  what_we_are_most_proud_of: >         # Optional but recommended — guides judges to your best work
    The fully working PRR signal detection algorithm with real 2x2 table
    calculations, automatic event clustering, and complete ICH M4 CTD
    gap report generator running with zero external dependencies.

  known_limitations: >                 # Optional but recommended — be honest about gaps
    Uses synthetic mock data, not connected to real FDA FAERS database.
    Document upload analysis is simulated, no real PDF parsing yet.
